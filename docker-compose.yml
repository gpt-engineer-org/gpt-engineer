version: "3.9"

services:
  gpt-engineer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: gpt-engineer
    stdin_open: true
    tty: true
    env_file:
      - .env
    # OR set the API key directly:
    # environment:
    #   - OPENAI_API_KEY=YOUR_API_KEY
    volumes:
      - ./projects/example:/project
