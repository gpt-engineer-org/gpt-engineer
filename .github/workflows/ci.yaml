name: Tox + Pytest (All Python Versions)

on:
  push:
    branches: [ main ]
    paths:
      - gpt_engineer/**
      - tests/**
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }} - ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Check Python version
        run: python --version

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip
          pip install poetry tox==4.15.0

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root

      - name: Run tests with Poetry (pytest)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          poetry run pytest -q --maxfail=1 --disable-warnings -v

      - name: Update lock file
        run: poetry lock
      - name: Install dependencies
        run: poetry install


      - name: Run tests via Tox (multi-environment)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          tox -vv

      # Optional: Enable later when Codecov is stable
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v5
      #   with:
      #     fail_ci_if_error: false
